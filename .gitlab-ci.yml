stages:
  - validate
  - build
  - publish

variables:
  BUN_VERSION: "1.3.4"

.validate:
  tags: [k8s]
  image: oven/bun:${BUN_VERSION}
  before_script:
    - bun --version
    - bun install --frozen-lockfile

typecheck:
  extends: .validate
  stage: validate
  script:
    - bun run typecheck

typecheck-host:
  extends: .validate
  stage: validate
  script:
    - bun run typecheck:host

test:
  extends: .validate
  stage: validate
  script:
    - bun test

build:
  stage: build
  tags: [k8s]
  image: node:22-bookworm
  needs:
    - typecheck
    - typecheck-host
    - test
  before_script:
    - npm install --global bun@${BUN_VERSION}
    - node --version
    - npm --version
    - bun --version
    - bun install --frozen-lockfile
  script:
    - bun run build:all
    - bun run verify:package
  artifacts:
    paths:
      - .artifacts/package.tgz
    expire_in: 1 day

publish-npm:
  stage: publish
  tags: [k8s]
  image: node:22-alpine
  needs:
    - job: typecheck
      artifacts: false
    - job: typecheck-host
      artifacts: false
    - job: test
      artifacts: false
    - job: build
      artifacts: true
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/
  script:
    - test "$CI_COMMIT_TAG" = "v$(node -p "require('./package.json').version")"
    - echo "//registry.npmjs.org/:_authToken=${NPM_TOKEN}" > .npmrc
    - npm publish .artifacts/package.tgz --access public
  after_script:
    - rm -f .npmrc
